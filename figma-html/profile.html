<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doorknock - Profile</title>
    <style>
      :root {
        --navy: #071d68;
        --bg: #f5f5f1;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --yellow: #fff09a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .page {
        min-height: 100vh;
        padding: 24px;
      }

      .shell {
        max-width: 1380px;
        min-height: calc(100vh - 48px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: 280px 1fr;
        border: 1px solid var(--border);
        border-radius: 28px;
        overflow: hidden;
        background: white;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }

      aside {
        background: var(--navy);
        color: white;
        padding: 28px;
        display: flex;
        flex-direction: column;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 30px;
        font-weight: 800;
      }

      .logo-mark {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: #fde047;
        color: var(--navy);
      }

      nav {
        margin-top: 56px;
        display: grid;
        gap: 8px;
      }

      .nav-item {
        padding: 14px 16px;
        border-radius: 18px;
        color: #dbeafe;
        font-weight: 600;
      }

      .nav-item.active {
        background: white;
        color: var(--navy);
      }

      .account {
        margin-top: auto;
      }

      .avatar-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: white;
        color: var(--navy);
        display: grid;
        place-items: center;
        font-size: 22px;
      }

      .meta small {
        color: #dbeafe;
      }

      .linkish {
        margin-top: 14px;
        padding: 12px 16px;
        border-radius: 18px;
        color: #dbeafe;
      }

      section {
        padding: 40px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: end;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--border);
      }

      .eyebrow {
        color: var(--navy);
        font-size: 14px;
        font-weight: 700;
      }

      .header h1 {
        margin: 12px 0 0;
        font-size: 42px;
      }

      .content {
        display: grid;
        gap: 32px;
        padding-top: 32px;
        grid-template-columns: 1fr 340px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 24px;
        background: white;
        padding: 28px;
      }

      .grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      label span {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 700;
        color: #334155;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 18px;
        font: inherit;
        color: var(--text);
        background: white;
      }

      input {
        height: 52px;
        padding: 0 16px;
      }

      textarea {
        min-height: 112px;
        padding: 14px 16px;
        resize: none;
      }

      .wide {
        grid-column: 1 / -1;
      }

      .cta-row {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 24px;
      }

      .cta {
        height: 48px;
        padding: 0 18px;
        border: 0;
        border-radius: 18px;
        background: var(--navy);
        color: white;
        font-weight: 700;
      }

      .status {
        color: var(--muted);
        font-size: 14px;
      }

      .summary {
        background: var(--yellow);
        box-shadow: 0 18px 30px rgba(148, 163, 184, 0.18);
      }

      .summary h2 {
        margin: 12px 0 20px;
        font-size: 32px;
      }

      .summary p {
        margin: 0 0 14px;
        font-size: 14px;
        line-height: 1.7;
      }

      @media (max-width: 1100px) {
        .shell {
          grid-template-columns: 1fr;
        }

        aside {
          display: none;
        }

        .content {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="shell">
        <aside>
          <div class="logo">
            <div class="logo-mark">✦</div>
            <div>Doorknock</div>
          </div>

          <nav>
            <div class="nav-item active">Runsheet</div>
            <div class="nav-item">Households</div>
            <div class="nav-item">Volunteers</div>
            <div class="nav-item">Map</div>
            <div class="nav-item">Analyse</div>
          </nav>

          <div class="account">
            <div class="avatar-row">
              <div class="avatar">◌</div>
              <div class="meta">
                <div>Anthony Admin</div>
                <small>Admin</small>
              </div>
            </div>
            <div class="linkish">Settings</div>
            <div class="linkish">Manage Users</div>
            <div class="linkish" style="color:#fecaca;">Log Out</div>
          </div>
        </aside>

        <section>
          <div class="header">
            <div>
              <div class="eyebrow">Authenticated profile</div>
              <h1>Profile settings</h1>
            </div>
          </div>

          <div class="content">
            <div class="card">
              <div class="grid">
                <label>
                  <span>Full name</span>
                  <input value="Anthony Admin" />
                </label>
                <label>
                  <span>Email</span>
                  <input value="admin@doorknock.test" />
                </label>
                <label>
                  <span>Phone number</span>
                  <input value="+61 493 707 842" />
                </label>
                <label>
                  <span>Role</span>
                  <input value="Admin" />
                </label>
                <label class="wide">
                  <span>Address</span>
                  <textarea>3/40 Edinburgh Street, Sydenham, Sydney, 3032</textarea>
                </label>
              </div>

              <div class="cta-row">
                <button class="cta" type="button">Save profile</button>
                <div class="status">Profile updated.</div>
              </div>
            </div>

            <aside class="card summary">
              <div style="font-size:14px;font-weight:700;color:#334155;">Current account</div>
              <h2>Anthony Admin</h2>
              <p><strong>Email:</strong> admin@doorknock.test</p>
              <p><strong>Role:</strong> Admin</p>
              <p><strong>Phone:</strong> +61 493 707 842</p>
            </aside>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
