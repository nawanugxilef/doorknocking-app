<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doorknock - Login</title>
    <style>
      :root {
        --navy: #071d68;
        --navy-strong: #0b287f;
        --bg: #f5f5f1;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --card: #ffffff;
        --soft: #eff6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .page {
        min-height: 100vh;
        padding: 24px;
      }

      .shell {
        max-width: 1200px;
        min-height: calc(100vh - 48px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: 0.95fr 1.05fr;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }

      .hero {
        background: var(--navy);
        color: white;
        padding: 40px;
        display: flex;
        flex-direction: column;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 34px;
        font-weight: 800;
      }

      .logo-mark {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: #fde047;
        color: #071d68;
        font-size: 24px;
      }

      .hero-copy {
        max-width: 430px;
        margin-top: 72px;
      }

      .hero-copy h1 {
        margin: 0;
        font-size: 52px;
        line-height: 1.08;
      }

      .hero-copy p {
        margin: 20px 0 0;
        color: #dbeafe;
        font-size: 18px;
        line-height: 1.75;
      }

      .feature-list {
        margin-top: auto;
        padding-top: 48px;
        display: grid;
        gap: 12px;
      }

      .feature {
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.1);
        padding: 16px 18px;
        color: #eff6ff;
        font-size: 15px;
      }

      .panel {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }

      .form-card {
        width: 100%;
        max-width: 420px;
      }

      .switcher {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: #f1f5f9;
      }

      .switcher button {
        height: 48px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #475569;
        font-size: 14px;
        font-weight: 700;
      }

      .switcher button.active {
        background: var(--navy);
        color: white;
      }

      form {
        margin-top: 32px;
        display: grid;
        gap: 16px;
      }

      label {
        display: block;
      }

      label span {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 700;
        color: #334155;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: white;
        color: var(--text);
        font: inherit;
      }

      input {
        height: 52px;
        padding: 0 16px;
      }

      textarea {
        min-height: 96px;
        padding: 14px 16px;
        resize: none;
      }

      .note {
        background: var(--soft);
        color: var(--navy);
        border-radius: 18px;
        padding: 14px 16px;
        font-size: 14px;
        line-height: 1.6;
      }

      .cta {
        height: 52px;
        border: 0;
        border-radius: 18px;
        background: var(--navy);
        color: white;
        font-size: 15px;
        font-weight: 700;
      }

      @media (max-width: 960px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .hero-copy h1 {
          font-size: 40px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="shell">
        <section class="hero">
          <div class="logo">
            <div class="logo-mark">✦</div>
            <div>Doorknock</div>
          </div>

          <div class="hero-copy">
            <h1>Doorknocking Web Application</h1>
            <p>
              Login for admins, volunteer coordinators, and doorknockers.
              Built to connect cleanly with households, runsheets, and map.
            </p>
          </div>

          <div class="feature-list">
            <div class="feature">Protected profile</div>
            <div class="feature">Admin-ready roles</div>
            <div class="feature">Task modules next</div>
          </div>
        </section>

        <section class="panel">
          <div class="form-card">
            <div class="switcher">
              <button class="active" type="button">Sign in</button>
              <button type="button">Sign up</button>
            </div>

            <form>
              <label>
                <span>Email</span>
                <input type="email" value="admin@doorknock.test" />
              </label>

              <label>
                <span>Password</span>
                <input type="password" value="password123" />
              </label>

              <button class="cta" type="button">Sign in</button>
            </form>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
