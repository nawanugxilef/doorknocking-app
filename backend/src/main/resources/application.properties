spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/doorknocking}
spring.datasource.username=${DATABASE_USERNAME:pepelgunawan}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:Z29vZC1kZWZhdWx0LWRvb3Jrbm9jay1qd3Qtc2VjcmV0LWZvci1sb2NhbC1kZXY=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://*.vercel.app}

app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
